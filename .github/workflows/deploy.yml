name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Which version to deploy'
        required: true
        default: 'v4'
        type: choice
        options:
          - v1
          - v2
          - v3
          - v4

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=v4" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout v1 (static site)
        if: steps.version.outputs.version == 'v1'
        uses: actions/checkout@v4
        with:
          ref: v1-classic
          path: v1-site

      - name: Checkout v2 (VS Code theme)
        if: steps.version.outputs.version == 'v2'
        uses: actions/checkout@v4
        with:
          ref: v2-vscode-theme
          path: v2-site

      - name: Setup Node
        if: steps.version.outputs.version == 'v2' || steps.version.outputs.version == 'v3'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (React)
        if: steps.version.outputs.version == 'v2' || steps.version.outputs.version == 'v3'
        run: |
          cd ${{ steps.version.outputs.version == 'v2' && 'v2-site' || '.' }}
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.version.outputs.version == 'v1' && 'v1-site' || steps.version.outputs.version == 'v2' && 'v2-site/dist' || steps.version.outputs.version == 'v4' && 'v4' || './dist' }}
