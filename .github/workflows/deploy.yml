name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Which version to deploy'
        required: true
        default: 'v4'
        type: choice
        options:
          - v1
          - v2
          - v3
          - v4

permissions:
  contents: write

# One deploy at a time; queue rather than cancel so a half-finished
# push to gh-pages is never interrupted.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pushes to main deploy v4. Manual runs deploy whichever version was picked.
      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="v4"
          fi
          case "$version" in
            v1) dir="v1-site" ;;
            v2) dir="v2-site/dist" ;;
            v3) dir="v3-site/dist" ;;
            v4) dir="v4" ;;
            *) echo "::error::Unknown version '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish_dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Deploying $version from $dir"

      - name: Checkout v1 (static site)
        if: steps.version.outputs.version == 'v1'
        uses: actions/checkout@v7
        with:
          ref: v1-classic
          path: v1-site

      - name: Checkout v2 (VS Code theme)
        if: steps.version.outputs.version == 'v2'
        uses: actions/checkout@v7
        with:
          ref: v2-vscode-theme
          path: v2-site

      - name: Checkout v3 (Android Studio theme)
        if: steps.version.outputs.version == 'v3'
        uses: actions/checkout@v7
        with:
          ref: v3-android-studio
          path: v3-site

      - name: Setup Node
        if: steps.version.outputs.version == 'v2' || steps.version.outputs.version == 'v3'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.version.outputs.version }}-site/package-lock.json

      - name: Build (React)
        if: steps.version.outputs.version == 'v2' || steps.version.outputs.version == 'v3'
        working-directory: ${{ steps.version.outputs.version }}-site
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.version.outputs.publish_dir }}

  # Mirrors the same v4/ files to Firebase Hosting so https://shreyashpattewar.web.app
  # serves exactly what https://shreyashp47.github.io/ serves. Runs only for pushes to
  # main (v4); manual runs of older versions stay GitHub Pages-only.
  firebase:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check Firebase credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHREYASHPATTEWAR }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_SHREYASHPATTEWAR is missing. Run 'firebase init hosting:github' once (see README) to create it."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHREYASHPATTEWAR }}
          projectId: shreyashpattewar
          channelId: live
