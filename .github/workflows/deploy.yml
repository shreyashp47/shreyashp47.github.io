name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Which version to deploy'
        required: true
        default: 'v2'
        type: choice
        options:
          - v1
          - v2

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=v2" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout v1 (static site)
        if: steps.version.outputs.version == 'v1'
        uses: actions/checkout@v4
        with:
          ref: v1-classic
          path: v1-site

      - name: Setup Node
        if: steps.version.outputs.version == 'v2'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build v2 (React)
        if: steps.version.outputs.version == 'v2'
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.version.outputs.version == 'v1' && 'v1-site' || './dist' }}
